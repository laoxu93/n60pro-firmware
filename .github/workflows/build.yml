name: "Build N60Pro Firmware"

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源码仓库 (immortalwrt / lede)'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - lede
      branch:
        description: '源码分支'
        required: true
        default: 'openwrt-24.10'
      plugins:
        description: '插件档位 (minimal=仅OpenClash / full=完整)'
        required: true
        default: 'full'
        type: choice
        options:
          - minimal
          - full
      upload_release:
        description: '构建完成后创建 Release'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 18 * * 5'
  watch:
    types: [started]

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  DEVICE: netcore_n60-pro
  TARGET: mediatek
  SUBTARGET: filogic

jobs:
  build:
    name: Build ${{ github.event.inputs.source || 'immortalwrt' }}_${{ github.event.inputs.branch || 'openwrt-24.10' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Prepare build info
        run: |
          SRC="${{ github.event.inputs.source }}"
          BR="${{ github.event.inputs.branch }}"
          [ -z "$SRC" ] && SRC="immortalwrt"
          [ -z "$BR" ] && BR="openwrt-24.10"
          if [ "$SRC" = "lede" ]; then
            url="https://github.com/coolsnowwolf/lede"
          else
            url="https://github.com/immortalwrt/immortalwrt"
          fi
          echo "REPO_URL=${url}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${BR}" >> $GITHUB_ENV
          echo "SOURCE=${SRC}" >> $GITHUB_ENV
          echo "PLUGINS=${{ github.event.inputs.plugins || 'full' }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "build_date=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/lib/jvm /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget subversion \
            python3 python3-pip ccache time xsltproc libelf-dev \
            ecj fastjar java-propose-classpath \
            libpcre3-dev texinfo help2man swig zip automake autoconf \
            device-tree-compiler dosfstools mtools default-jdk libgmp3-dev \
            libmpc-dev libmpfr-dev bc pkg-config
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source
        run: |
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          git fetch --unshallow 2>/dev/null || true
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Inject config and diy scripts
        run: |
          cp .config openwrt/.config
          cp diy-part1.sh openwrt/diy-part1.sh
          cp diy-part2.sh openwrt/diy-part2.sh
          chmod +x openwrt/diy-part1.sh openwrt/diy-part2.sh

      - name: diy-part1.sh (feeds)
        run: |
          cd openwrt
          if [ "$PLUGINS" = "minimal" ]; then
            ./diy-part1.sh minimal
          else
            ./diy-part1.sh full
          fi

      - name: Update feeds & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: diy-part2.sh (post-install package selection)
        run: |
          cd openwrt
          if [ "$PLUGINS" = "minimal" ]; then
            ./diy-part2.sh minimal
          else
            ./diy-part2.sh full
          fi

      - name: Sanity check target
        run: |
          cd openwrt
          echo "--- target check ---"
          grep -E '^CONFIG_TARGET_(BOARD|PROFILE)' .config
          if ! grep -q 'DEVICE_netcore_n60-pro' .config; then
            echo "::error::target device netcore_n60-pro 未选中, 中止"
            exit 1
          fi

      - name: Generate .config (defconfig + STRICT validate)
        run: |
          cd openwrt
          # 备份我们手工写入的包选择
          cp .config .config.diy
          make defconfig
          echo "=== after defconfig ==="
          grep -E '^CONFIG_TARGET_(BOARD|PROFILE)' .config

          # defconfig 会剔除它认为"未安装"的包, 这里逐个复查
          MISSING=""
          for p in luci-app-openclash dnsmasq-full; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "::error::${p} 被 defconfig 剔除"
              MISSING="${MISSING} ${p}"
            else
              echo "OK  ${p}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "以下包在 defconfig 后消失: $MISSING"
            echo "--- package/ 下实际存在吗? ---"
            for p in $MISSING; do
              echo -n "$p: "; find package feeds -maxdepth 4 -type d -name "$p" 2>/dev/null | head -1 || echo "NOT FOUND"
            done
            echo "--- 相关配置行 ---"
            grep -E "^#? ?CONFIG_PACKAGE_(luci-app-openclash|dnsmasq)" .config || true
            exit 1
          fi
          echo "=== 冲突检查: dnsmasq 必须关闭 ==="
          if grep -q "^CONFIG_PACKAGE_dnsmasq=y" .config; then
            echo "::error::dnsmasq 与 dnsmasq-full 冲突"
            exit 1
          fi
          echo "全部关键包校验通过"

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | tail -50 || true
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        id: build
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Verify firmware manifest contains plugins
        if: success()
        run: |
          cd openwrt
          MANIFEST=$(find bin/targets -name '*.manifest' | head -1)
          echo "manifest: $MANIFEST"
          [ -z "$MANIFEST" ] && { echo "::error::找不到 manifest"; exit 1; }
          echo "--- 全部插件包 ---"
          grep -E 'luci-app-|luci-theme-' "$MANIFEST" || true

          FAIL=0
          REQ="luci-app-openclash dnsmasq-full"
          if [ "$PLUGINS" = "full" ]; then
            REQ="$REQ luci-app-lucky luci-app-adguardhome"
          fi
          for p in $REQ; do
            if grep -q "^${p} " "$MANIFEST"; then
              echo "OK   ${p}"
            else
              echo "::error::固件中缺少 ${p}"
              FAIL=1
            fi
          done
          [ "$FAIL" = "1" ] && exit 1
          echo "=== 固件包清单校验通过 ==="

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p ./firmware
          find openwrt/bin/targets/ -maxdepth 3 -type f \
            \( -name '*netcore*' -o -name '*n60*' -o -name 'config.buildinfo' \
               -o -name 'sha256sums' -o -name '*Packages*' \) \
            -exec cp {} ./firmware/ \; 2>/dev/null || true
          ls -lh ./firmware || echo "no firmware produced"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-${{ env.SOURCE }}-${{ env.BUILD_DATE }}
          path: ./firmware/
          retention-days: 30

      - name: Publish release
        if: github.event.inputs.upload_release == 'true' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: n60pro-${{ env.SOURCE }}-${{ env.BUILD_DATE }}
          name: N60 Pro ${{ env.SOURCE }} ${{ env.BUILD_DATE }}
          body: |
            # N60 Pro 固件

            - 源码: ${{ env.REPO_URL }} (${{ env.REPO_BRANCH }} @ ${{ env.commit }})
            - 设备: Netcore N60 Pro (MT7986A, mediatek/filogic)
            - 插件档位: ${{ env.PLUGINS }}
            - 构建时间: ${{ steps.build.outputs.build_date }}
            - 默认 LAN IP: 192.168.5.1

            ## 刷机提示
            1. 先在 Breed / U-Boot 里备份原厂固件
            2. 用 **sysupgrade** 包升级, 不要用 factory 包覆盖
            3. 首次启动约 2-3 分钟, 灯会闪属正常
            4. 访问 http://192.168.5.1 进入 LuCI
          files: ./firmware/*
          draft: false
          prerelease: false

      - name: Show build log tail on failure
        if: failure()
        run: |
          echo "=== 最后 200 行构建日志 ==="
          tail -200 openwrt/build.log 2>/dev/null || echo "no log"
